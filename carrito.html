<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Café & Tueste Bistro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans flex flex-col min-h-screen">
    <nav class="bg-white/90 backdrop-blur-md sticky top-0 z-40 shadow-sm border-b border-stone-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <a href="index.html" class="font-serif text-2xl font-bold text-stone-900 tracking-tight">
                    Café <span class="text-amber-700">&</span> Tueste.
                </a>
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="text-stone-600 hover:text-amber-700 font-medium transition">Inicio</a>
                    <a href="catalogo.html" class="text-stone-600 hover:text-amber-700 font-medium transition">Menú</a>
                    <a href="carrito.html" class="text-stone-600 hover:text-amber-700 font-medium transition">Carrito</a>
                </div>
                <div class="flex items-center">
                    <a href="carrito.html" class="relative p-2 text-stone-600 hover:text-amber-700 transition">
                        <i class="fa-solid fa-cart-shopping text-xl"></i>
                        <span class="cart-badge hidden absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/4 -translate-y-1/4 bg-amber-600 rounded-full">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <main class="flex-grow">
        
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="font-serif text-4xl font-bold text-stone-900 mb-8">Carrito de Compras</h1>
    <div class="flex flex-col lg:flex-row gap-8">
        <div class="w-full lg:w-2/3 bg-white rounded-2xl shadow-sm border border-stone-100 p-6" id="cart-container"></div>
        <div class="w-full lg:w-1/3">
            <div class="bg-white rounded-2xl shadow-sm border border-stone-100 p-6 sticky top-24">
                <h2 class="text-xl font-bold text-stone-900 mb-6">Resumen de Orden</h2>
                <div class="space-y-4 mb-6 text-stone-600">
                    <div class="flex justify-between"><span>Subtotal</span><span id="summary-subtotal" class="font-medium text-stone-900">L. 0.00</span></div>
                    <div class="flex justify-between"><span>Impuestos (ISV 15%)</span><span id="summary-tax" class="font-medium text-stone-900">L. 0.00</span></div>
                </div>
                <div class="border-t border-stone-200 pt-4 mb-6">
                    <div class="flex justify-between items-center"><span class="text-lg font-bold text-stone-900">Total</span><span id="summary-total" class="text-2xl font-bold text-amber-700">L. 0.00</span></div>
                </div>
                <a href="checkout.html" id="btn-checkout" class="block w-full bg-stone-900 hover:bg-stone-800 text-white text-center font-bold py-4 rounded-xl transition shadow-md">Proceder al Pago</a>
                <button onclick="window.appStore.empty(); updateCartView();" class="block w-full mt-4 text-stone-500 hover:text-red-500 text-sm font-medium transition">Vaciar Carrito</button>
            </div>
        </div>
    </div>
</div>

    </main>
    <footer class="bg-stone-900 text-stone-300 py-12 mt-12 border-t-4 border-amber-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-3 gap-8">
            <div>
                <h3 class="font-serif text-2xl font-bold text-white mb-4">Café & Tueste.</h3>
                <p class="text-stone-400">Elevando la experiencia del café hondureño.</p>
            </div>
            <div>
                <h4 class="text-lg font-semibold text-white mb-4">Enlaces</h4>
                <ul class="space-y-2">
                    <li><a href="index.html" class="hover:text-amber-500 transition">Inicio</a></li>
                    <li><a href="catalogo.html" class="hover:text-amber-500 transition">Catálogo</a></li>
                </ul>
            </div>
        </div>
    </footer>
    <script src="js/db.js"></script>
    <script src="js/store.js"></script>
    <script>
const updateCartView = () => {
    const container = document.getElementById('cart-container');
    const btn = document.getElementById('btn-checkout');
    const { cart } = window.appStore;
    
    if(cart.length === 0) {
        container.innerHTML = `
            <div class="text-center py-16">
                <h3 class="text-2xl font-bold text-stone-900 mb-2">Tu carrito está vacío</h3>
                <a href="catalogo.html" class="inline-block bg-amber-600 text-white font-medium py-3 px-8 rounded-lg mt-4">Explorar Menú</a>
            </div>`;
        btn.classList.add('opacity-50', 'pointer-events-none');
    } else {
        container.innerHTML = `<div class="divide-y divide-stone-100">` + cart.map(item => `
            <div class="py-6 flex flex-col sm:flex-row gap-4 items-center">
                <img src="${item.img}" alt="${item.name}" class="w-24 h-24 object-cover rounded-xl shadow-sm">
                <div class="flex-grow text-center sm:text-left">
                    <h4 class="font-bold text-lg text-stone-900">${item.name}</h4>
                    <p class="text-stone-500 text-sm mb-2">Precio Unitario: L. ${item.price.toFixed(2)}</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center bg-stone-100 rounded-lg p-1">
                        <button onclick="window.appStore.updateQty('${item.id}', -1); updateCartView();" class="w-8 h-8 rounded bg-white shadow-sm font-bold">-</button>
                        <span class="w-10 text-center font-medium">${item.qty}</span>
                        <button onclick="window.appStore.updateQty('${item.id}', 1); updateCartView();" class="w-8 h-8 rounded bg-white shadow-sm font-bold">+</button>
                    </div>
                    <div class="w-24 text-right font-bold text-stone-900 text-lg">L. ${(item.price * item.qty).toFixed(2)}</div>
                    <button onclick="window.appStore.remove('${item.id}'); updateCartView();" class="text-stone-400 hover:text-red-500 p-2"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>`).join('') + `</div>`;
        btn.classList.remove('opacity-50', 'pointer-events-none');
    }
    const totals = window.appStore.getTotals();
    document.getElementById('summary-subtotal').textContent = `L. ${totals.subtotal.toFixed(2)}`;
    document.getElementById('summary-tax').textContent = `L. ${totals.tax.toFixed(2)}`;
    document.getElementById('summary-total').textContent = `L. ${totals.total.toFixed(2)}`;
};
document.addEventListener('DOMContentLoaded', updateCartView);
</script>
</body>
</html>
