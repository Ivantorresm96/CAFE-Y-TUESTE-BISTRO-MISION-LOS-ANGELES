<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Café & Tueste Bistro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans flex flex-col min-h-screen">
    <nav class="bg-white/90 backdrop-blur-md sticky top-0 z-40 shadow-sm border-b border-stone-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <a href="index.html" class="font-serif text-2xl font-bold text-stone-900 tracking-tight">
                    Café <span class="text-amber-700">&</span> Tueste.
                </a>
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="text-stone-600 hover:text-amber-700 font-medium transition">Inicio</a>
                    <a href="catalogo.html" class="text-stone-600 hover:text-amber-700 font-medium transition">Menú</a>
                    <a href="carrito.html" class="text-stone-600 hover:text-amber-700 font-medium transition">Carrito</a>
                </div>
                <div class="flex items-center">
                    <a href="carrito.html" class="relative p-2 text-stone-600 hover:text-amber-700 transition">
                        <i class="fa-solid fa-cart-shopping text-xl"></i>
                        <span class="cart-badge hidden absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/4 -translate-y-1/4 bg-amber-600 rounded-full">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <main class="flex-grow">
        
<div class="bg-stone-100 py-12 border-b border-stone-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <h1 class="font-serif text-4xl font-bold text-stone-900 mb-4">Nuestro Menú</h1>
    </div>
</div>
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="flex flex-col md:flex-row gap-6 mb-10 items-center justify-between bg-white p-6 rounded-2xl shadow-sm border border-stone-100">
        <div class="w-full md:w-1/3 relative">
            <i class="fa-solid fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-stone-400"></i>
            <input type="text" id="search-input" placeholder="Buscar producto..." class="w-full pl-10 pr-4 py-3 rounded-lg border border-stone-200">
        </div>
        <div class="w-full md:w-auto flex gap-2 overflow-x-auto pb-2 md:pb-0" id="filter-buttons">
            <button class="filter-btn active px-5 py-2 rounded-full border border-stone-200 font-medium text-sm" data-filter="all">Todos</button>
            <button class="filter-btn px-5 py-2 rounded-full border border-stone-200 font-medium text-sm" data-filter="Cafés">Cafés</button>
            <button class="filter-btn px-5 py-2 rounded-full border border-stone-200 font-medium text-sm" data-filter="Bebidas Frías">Frías</button>
            <button class="filter-btn px-5 py-2 rounded-full border border-stone-200 font-medium text-sm" data-filter="Jugos">Jugos</button>
            <button class="filter-btn px-5 py-2 rounded-full border border-stone-200 font-medium text-sm" data-filter="Panadería">Panadería</button>
            <button class="filter-btn px-5 py-2 rounded-full border border-stone-200 font-medium text-sm" data-filter="Postres">Postres</button>
        </div>
        <select id="sort-select" class="py-3 px-4 rounded-lg border border-stone-200">
            <option value="name">Nombre (A-Z)</option>
            <option value="price-asc">Menor Precio</option>
            <option value="price-desc">Mayor Precio</option>
        </select>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="catalog-grid"></div>
</div>

    </main>
    <footer class="bg-stone-900 text-stone-300 py-12 mt-12 border-t-4 border-amber-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-3 gap-8">
            <div>
                <h3 class="font-serif text-2xl font-bold text-white mb-4">Café & Tueste.</h3>
                <p class="text-stone-400">Elevando la experiencia del café hondureño.</p>
            </div>
            <div>
                <h4 class="text-lg font-semibold text-white mb-4">Enlaces</h4>
                <ul class="space-y-2">
                    <li><a href="index.html" class="hover:text-amber-500 transition">Inicio</a></li>
                    <li><a href="catalogo.html" class="hover:text-amber-500 transition">Catálogo</a></li>
                </ul>
            </div>
        </div>
    </footer>
    <script src="js/db.js"></script>
    <script src="js/store.js"></script>
    <script>
document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('catalog-grid');
    const render = (items) => {
        grid.innerHTML = items.map(p => `
            <div class="bg-white rounded-2xl shadow-sm border border-stone-100 overflow-hidden hover:shadow-xl transition-all duration-300 flex flex-col group">
                <div class="relative aspect-[4/3] overflow-hidden bg-stone-100">
                    <img src="${p.img}" alt="${p.name}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    ${p.tag ? `<span class="absolute top-3 left-3 bg-amber-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-md z-20">${p.tag}</span>` : ''}
                </div>
                <div class="p-5 flex flex-col flex-grow">
                    <span class="text-xs font-semibold text-stone-400 uppercase tracking-wider mb-1">${p.category}</span>
                    <h3 class="font-bold text-lg text-stone-900 mb-1">${p.name}</h3>
                    <p class="text-sm text-stone-500 mb-4 line-clamp-2">${p.desc}</p>
                    <div class="mt-auto flex items-center justify-between pt-4 border-t border-stone-50">
                        <span class="font-bold text-xl text-amber-700">L. ${p.price.toFixed(2)}</span>
                        <button onclick="window.appStore.add('${p.id}')" class="bg-stone-900 hover:bg-amber-600 text-white px-4 py-2 rounded-lg font-medium transition-colors text-sm">Agregar</button>
                    </div>
                </div>
            </div>`).join('');
    };

    const applyFilters = () => {
        const term = document.getElementById('search-input').value.toLowerCase();
        const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
        const sort = document.getElementById('sort-select').value;
        let filtered = PRODUCT_DB.filter(p => (activeFilter === 'all' || p.category === activeFilter) && p.name.toLowerCase().includes(term));
        if(sort === 'price-asc') filtered.sort((a,b) => a.price - b.price);
        if(sort === 'price-desc') filtered.sort((a,b) => b.price - a.price);
        if(sort === 'name') filtered.sort((a,b) => a.name.localeCompare(b.name));
        render(filtered);
    };

    document.getElementById('search-input').addEventListener('input', applyFilters);
    document.getElementById('sort-select').addEventListener('change', applyFilters);
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('bg-stone-900', 'text-white', 'active'));
            e.target.classList.add('active', 'bg-stone-900', 'text-white');
            applyFilters();
        });
    });
    document.querySelector('.filter-btn.active').classList.add('bg-stone-900', 'text-white');
    applyFilters();
});
</script>
</body>
</html>
